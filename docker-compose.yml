services:
  web:
    build:
      context: .
      target: runtime
    image: poulies-courroies:latest
    container_name: poulies-courroies
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      WEB_CONCURRENCY: "2"
      THREADS: "4"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
